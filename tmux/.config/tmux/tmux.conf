# ── Prefix & basics ─────────────────────────────────────────────────────────────
# Ctrl+Space — disable macOS Input Sources > "Select the previous input source"
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g detach-on-destroy off
set -g allow-rename off
set -g mouse on
set -sg escape-time 1

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -g focus-events on

set -g status-position top
set -g visual-activity off
set -g visual-bell off
set -g visual-silence on
setw -g monitor-activity off
set -g bell-action none

set-window-option -g mode-keys vi

# ── Keybindings ─────────────────────────────────────────────────────────────────
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind-key '|' split-window -h -p 25 -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf

unbind p
bind p previous-window

bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -n M-Up select-pane -t :.-
bind -n M-Down select-pane -t :.+

bind-key "T" display-popup -E -w 55% -h 60% "zsh -i -c sesh_connect"
bind-key "S" display-popup -E -w 55% -h 60% "zsh -i -c sesh_connect"
bind-key "g" display-popup -E -w 80% -h 80% "lazygit"
bind O new-window -c "#{pane_current_path}" "nvim ."

# ── tmux2k (status bar, window list, theme) ───────────────────────────────────
# https://github.com/2KAbhishek/tmux2k — requires bash 5.2+ (brew install bash)
set -g @tmux2k-theme "catppuccin"
set -g @tmux2k-left-plugins "session git cwd"
set -g @tmux2k-right-plugins "cpu ram battery network time"
set -g @tmux2k-window-list-alignment "absolute-centre"
set -g @tmux2k-window-list-format "#I:#W"
set -g @tmux2k-git-display-status "true"
set -g @tmux2k-cwd-length "45"
set -g @tmux2k-refresh-rate "10"

# ── Session name with git branch ────────────────────────────────────────────────
set-hook -g session-created "run-shell '~/.config/tmux/scripts/update-session-name.sh \"#{session_name}\"'"
set-hook -g window-linked "run-shell '~/.config/tmux/scripts/update-session-name.sh \"#{session_name}\"'"
run-shell '~/.config/tmux/scripts/update-session-name.sh "#{session_name}"'

# ── TPM plugins (utility; theme handled by tmux2k) ──────────────────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "2kabhishek/tmux2k"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"

set -g @continuum-restore "on"
set -g @continuum-save-interval "15"
set -g @yank_action "copy-pipe-and-cancel"
set -g @yank_with_mouse "on"

if-shell 'test -f /opt/homebrew/opt/tpm/share/tpm/tpm' 'run /opt/homebrew/opt/tpm/share/tpm/tpm'
if-shell 'test -f /usr/local/opt/tpm/share/tpm/tpm' 'run /usr/local/opt/tpm/share/tpm/tpm'
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run ~/.tmux/plugins/tpm/tpm'

# ── Pane navigation (C-hjkl always selects pane; use M-hjkl as alt) ────────────
bind-key -n 'C-h' select-pane -L
bind-key -n 'C-j' select-pane -D
bind-key -n 'C-k' select-pane -U
bind-key -n 'C-l' select-pane -R
bind-key -n 'C-\' select-pane -l
