# change the prefix from 'C-b' to 'C-Space'
# On macOS, Ctrl+Space is sent as NUL (null byte / ^@) by most terminals.
# Also disable System Settings > Keyboard > Shortcuts > Input Sources > "Select the previous input source"
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# start with window 1 (instead of 0)
set -g base-index 1
# start with pane 1
set -g pane-base-index 1
# Renumber windows when one is closed
set -g renumber-windows on

set -g set-clipboard on

# split panes using | and -, make sure they open in the same path
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Create a vertical split at 25% width
bind-key '|' split-window -h -p 25 -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.config/tmux/tmux.conf

unbind p
bind p previous-window

# Shift+Left/Right to switch windows without prefix
bind -n S-Left previous-window
bind -n S-Right next-window

# shorten command delay
set -sg escape-time 1

# Stay in tmux when the last pane/window of a session is closed
set -g detach-on-destroy off

# Sesh session picker  (Prefix + T)
# Opens a popup with fzf; picks from running sessions + zoxide history.
# New sessions auto-open nvim on window 1 and a blank terminal on window 2.
bind-key "T" display-popup -E -w 55% -h 60% "zsh -i -c sesh_connect"

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Cycle pane focus forward/backward
bind -n M-Up select-pane -t :.-
bind -n M-Down select-pane -t :.+

# enable vi mode keys
set-window-option -g mode-keys vi

# set default terminal mode to 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# allow focus events to get through to applications running in tmux
set -g focus-events on

set -g visual-activity off
set -g visual-bell off
set -g visual-silence on
setw -g monitor-activity off
set -g bell-action none

# catppuccin/tmux (colors overridden by tmux-theme.conf from colorscheme-set.sh)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

source-file ~/.config/tmux/tmux-theme.conf

# Status bar: session (left), directory + git (right); window tabs show path
set -g status-left-length 80
set -g status-right-length 120
set -gF status-left "#{E:@catppuccin_status_session}"
set -gF status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{@catppuccin_status_gitmux}"

# ── TPM plugins ───────────────────────────────────────────────────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux#v2.3.0"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "tmux-plugins/tmux-open"
set -g @plugin "laktibrada/tmux-extrakto"

# Session persistence (resurrect + continuum)
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

# tmux-yank (vi copy mode → clipboard on macOS)
set -g @yank_action "copy-pipe-and-cancel"
set -g @yank_with_mouse "on"

# tmux-fzf: Prefix + f
set -g @tmux-fzf-launch-key "f"

# tmux-open: Prefix + O (shift+o) — open path/file at cursor in $EDITOR
bind O run-shell "tmux-open"

# TPM path: Homebrew (macOS) or manual clone to ~/.tmux/plugins/tpm
if-shell 'test -f /opt/homebrew/opt/tpm/share/tpm/tpm' 'run /opt/homebrew/opt/tpm/share/tpm/tpm'
if-shell 'test -f /usr/local/opt/tpm/share/tpm/tpm' 'run /usr/local/opt/tpm/share/tpm/tpm'
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run ~/.tmux/plugins/tpm/tpm'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" -eq 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" -eq 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
