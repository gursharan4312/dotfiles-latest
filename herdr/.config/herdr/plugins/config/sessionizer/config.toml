[projects]
# Parent folders searched by the interactive pickers
roots = ["~/dev/", "~/Workspace","~/dev/stackadapt", "~/dev/stackadapt/web-worktrees"]

[layout]
# How the plugin pane itself opens: overlay | split
placement = "overlay"
# Which pane or tab to focus after layout creation
focus = "editor"

[tabs.dev]
label = "dev"

[[tabs.dev.panes]]
id = "editor"
title = "nvim"
command = "nvim"

[[tabs.dev.panes]]
id = "agent"
# Split this pane from the earlier pane with id = "editor"
from = "editor"
title = "agent"
# Split direction for the new pane: right or down
split = "right"
# Optional: ratio controls the new pane's share of the split axis (0 < ratio < 1)
ratio = 0.3
command = "opencode"

[[tabs.dev.panes]]
id = "git"
# Split this pane from the earlier pane with id = "editor"
from = "editor"
title = "lazygit"
# Split direction for the new pane: right or down
split = "down"
command = "lazygit"
