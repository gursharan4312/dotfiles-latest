# ── First-run onboarding ──────────────────────────────────────────────────────
onboarding = false

# ── Prefix: ctrl+space (mirrors tmux) ──────────────────────────────────────────
# macOS tip: disable "Select the previous input source" in System Settings >
# Keyboard > Input Sources, exactly like the tmux setup, so C-Space reaches herdr.
[keys]
prefix = "ctrl+space"

# Split bindings (herdr names the layout by pane stack direction; the user-facing
# "vertical cut" / "horizontal cut" terminology is the opposite — swap accordingly):
#   prefix+\  → stacked (top/bottom)               matches tmux: bind \
#   prefix+-  → side-by-side (left/right)          matches tmux: bind -
split_horizontal = "prefix+-"
split_vertical   = "prefix+\\"

# Direct pane nav, matches tmux bind -n C-h/j/k/l:
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

# Tab nav lives on the modifier-arrow chords only (mirrors tmux bind -n S-Left/Right).
# prefix+n is freed for new workspace.
previous_tab = "shift+left"
next_tab     = "shift+right"
new_workspace = "prefix+n"

# Native new-tab action moved off prefix+c: it resolves the cwd from the pane's
# spawn-time record, so tabs open in the pane's ORIGINAL dir even after a cd.
# prefix+c is rebound below to `herdr tab create` (API path, live process cwd).
new_tab = "prefix+shift+c"

# NOTE: the native open_worktree action is deliberately NOT bound — it refuses
# to run from a linked-worktree workspace (linked_worktree_source guard).
# prefix+shift+o is bound below to herdr-worktree-picker instead, which
# resolves the main repo first and therefore works from any pane in the repo.
# new_worktree (create + open) stays on its default prefix+shift+g and only
# works from the repo parent workspace (same upstream guard).

# ── New panes/tabs/workspaces inherit the focused pane's cwd ──────────────────
# Mirrors tmux: bind c new-window -c "#{pane_current_path}" (and the -c splits).
# Other accepted values: "home", "current" (herdr process dir), or a fixed path.
[terminal]
new_cwd = "follow"

# ── Theme: catppuccin to match tmux2k ──────────────────────────────────────────
[theme]
name = "catppuccin"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

# ── Lazygit popup (mirrors tmux: bind-key "g" display-popup "lazygit") ────────
# `type = "pane"` opens a temporary pane and closes it when the command exits.
# Trade-off: prefix+g no longer fires herdr's default `goto` picker.
[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"
description = "open lazygit"

# ── Smart opener: fzf any dir under ~/dev, ~/Workspace, … ────────────────────
# Picked path is auto-routed:
#   * linked git worktree → `herdr worktree open` (groups under parent repo, like `lazygit X`)
#   * plain repo/folder   → `herdr workspace create` (or focus if already open)
# Mirrors tmux-sesh's `bind T display-popup -E "sesh connect"`.
# Script: ~/github/dotfiles-latest/lazygit/.local/bin/herdr-open
[[keys.command]]
key = "prefix+shift+f"
type = "pane"
command = "herdr-open"
description = "fzf-open folder or worktree"

# ── Sessionizer (kept for projects outside the configured roots) ───────────────
# Only `sessionizer.open`, which never creates worktrees — it focuses existing
# workspaces or creates plain project workspaces from fzf over projects.roots.
# On prefix+shift+n (free: new_workspace default, remapped to prefix+n above) so
# prefix+shift+t keeps its default rename_tab action.
[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "sessionizer.open"
description = "sessionizer: fzf project from projects.roots"

# ── New tab in the focused pane's CURRENT dir (mirrors tmux bind c) ───────────
# The API resolves the focused pane's live process cwd, unlike the native
# new_tab action (stale spawn-time cwd). `type = "shell"` runs detached.
[[keys.command]]
key = "prefix+c"
type = "shell"
command = "herdr tab create --focus"
description = "new tab in current dir"

# ── Worktree picker: fzf this repo's worktrees, open pick as workspace ────────
# Replaces the native open_worktree action, which bails from linked-worktree
# workspaces. Script: ~/github/dotfiles-latest/lazygit/.local/bin/herdr-worktree-picker
[[keys.command]]
key = "prefix+shift+o"
type = "pane"
command = "herdr-worktree-picker"
description = "fzf-open a worktree of this repo"
