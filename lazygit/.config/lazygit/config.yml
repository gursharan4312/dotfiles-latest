os:
  # Edit (`e`): open file in the parent nvim instance at the cursor line.
  editPreset: "nvim-remote"
  # Open (`o`): lazygit has no `openPreset`. Use nvim's `--remote` against the
  # parent instance's RPC socket ($NVIM, set automatically when lazygit is
  # launched from inside nvim) so the file opens in that same nvim.
  open: 'nvim --server "$NVIM" --remote "{{filename}}"'

customCommands:
  - key: "<c-a>"
    context: "files"
    description: "AI commit message (GitHub Models / Copilot)"
    command: "lazygit-ai-commit"
    loadingText: "Generating AI commit suggestions..."
    output: terminal
  - key: "X"
    context: "localBranches"
    description: "Open branch worktree in tmux window"
    command: "zsh -c 'source \"$HOME/github/dotfiles-latest/zsh/modules/sesh.sh\"; sesh_open_worktree_branch \"$1\"' -- {{ .SelectedLocalBranch.Name | quote }}"
    loadingText: "Opening branch worktree in tmux..."
  - key: "<space>"
    context: "localBranches"
    description: "Open branch worktree in tmux session"
    command: "zsh -c 'source \"$HOME/github/dotfiles-latest/zsh/modules/sesh.sh\"; sesh_open_worktree_branch \"$1\"' -- {{ .SelectedLocalBranch.Name | quote }}"
    loadingText: "Opening branch worktree in tmux..."
